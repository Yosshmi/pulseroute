name: quality
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: pulseroute
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: pulseroute_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pulseroute -d pulseroute_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://pulseroute:test-only-password@localhost:5432/pulseroute_test?sslmode=disable
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.27.x', cache: true}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - name: Format, vet, race tests, frontend lint, unit tests and build
        run: bash scripts/test.sh
      - name: Build all commands
        run: go build ./cmd/...
      - name: Check shell syntax
        run: for script in scripts/*.sh; do bash -n "$script"; done
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - name: Create local demo configuration
        run: bash scripts/setup.sh
      - name: Build and start complete stack
        env: {RECEIVER_SECRET: browser-receiver-secret}
        run: docker compose up --build --wait --wait-timeout 180
      - name: Verify readiness and seed synthetic data
        env: {RECEIVER_SECRET: browser-receiver-secret}
        run: |
          curl --fail http://localhost:8080/ready
          curl --fail http://localhost:3000/ > /dev/null
          bash scripts/seed.sh --events 6
      - name: Browser workflow
        working-directory: frontend
        env: {E2E_RECEIVER_URL: 'http://receiver:8090'}
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Capture logs
        if: always()
        run: docker compose logs --no-color > compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            compose.log
            frontend/test-results/
      - name: Stop test stack
        if: always()
        run: docker compose down -v
