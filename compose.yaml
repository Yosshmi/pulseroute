name: pulseroute
x-backend: &backend
  build:
    context: .
    dockerfile: deployments/docker/Dockerfile
  image: pulseroute:local
  restart: unless-stopped
  environment: &environment
    DATABASE_URL: postgres://pulseroute:${POSTGRES_PASSWORD:?Run scripts/setup.sh}@postgres:5432/pulseroute?sslmode=disable
    REDIS_URL: redis://redis:6379/0
    ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Run scripts/setup.sh}
    COOKIE_SECURE: "false"
    ALLOW_PRIVATE_ENDPOINTS: "true"
    WORKERS: ${WORKERS:-5}
    HTTP_TIMEOUT: ${HTTP_TIMEOUT:-10s}
    LEASE_DURATION: ${LEASE_DURATION:-60s}
    RECEIVER_SECRET: ${RECEIVER_SECRET:?Run scripts/setup.sh}
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
    migrate: {condition: service_completed_successfully}
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: pulseroute
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup.sh}
      POSTGRES_DB: pulseroute
    volumes: [postgres-data:/var/lib/postgresql]
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U pulseroute -d pulseroute"]
      interval: 5s
      timeout: 3s
      retries: 15
  redis:
    image: redis:7-alpine
    command: [redis-server, --save, "", --appendonly, "no"]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 15
  migrate:
    <<: *backend
    restart: "no"
    command: [/app/bin/migrate]
    depends_on:
      postgres: {condition: service_healthy}
  api:
    <<: *backend
    ports: ["127.0.0.1:8080:8080"]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/ready]
      interval: 10s
      timeout: 3s
      retries: 10
  worker:
    <<: *backend
    command: [/app/bin/worker]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8081/ready]
      interval: 10s
      timeout: 3s
      retries: 10
  receiver:
    <<: *backend
    command: [/app/bin/receiver]
    environment:
      PORT: "8090"
      RECEIVER_SECRET: ${RECEIVER_SECRET:?Run scripts/setup.sh}
    depends_on: {}
    ports: ["127.0.0.1:8090:8090"]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8090/health]
      interval: 10s
      timeout: 3s
      retries: 10
  frontend:
    build:
      context: .
      dockerfile: deployments/docker/frontend.Dockerfile
    ports: ["127.0.0.1:3000:8080"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/]
      interval: 10s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
