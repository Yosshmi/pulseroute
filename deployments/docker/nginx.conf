server {
 listen 8080;
 server_name _;
 root /usr/share/nginx/html;
 client_max_body_size 1m;
 add_header X-Content-Type-Options nosniff always;
 add_header Content-Security-Policy "default-src 'self'; style-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;
 location /api/ { proxy_pass http://api:8080; proxy_set_header Host $http_host; }
 location /v1/ { proxy_pass http://api:8080; proxy_set_header Host $http_host; }
 location / { try_files $uri $uri/ /index.html; }
}
