apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulseroute-api
spec:
  replicas: 2
  selector:
    matchLabels: {app: pulseroute-api}
  template:
    metadata:
      labels: {app: pulseroute-api}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000}
      containers:
        - name: api
          image: pulseroute:local
          command: [/app/bin/api]
          ports: [{containerPort: 8080}]
          envFrom: [{configMapRef: {name: pulseroute}}, {secretRef: {name: pulseroute-secrets}}]
          readinessProbe: {httpGet: {path: /ready, port: 8080}, initialDelaySeconds: 5, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health, port: 8080}, initialDelaySeconds: 10, periodSeconds: 15}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
      terminationGracePeriodSeconds: 30
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulseroute-worker
spec:
  replicas: 2
  selector:
    matchLabels: {app: pulseroute-worker}
  template:
    metadata:
      labels: {app: pulseroute-worker}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000}
      containers:
        - name: worker
          image: pulseroute:local
          command: [/app/bin/worker]
          ports: [{containerPort: 8081}]
          envFrom: [{configMapRef: {name: pulseroute}}, {secretRef: {name: pulseroute-secrets}}]
          readinessProbe: {httpGet: {path: /ready, port: 8081}, initialDelaySeconds: 5, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health, port: 8081}, initialDelaySeconds: 10, periodSeconds: 15}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata: {name: pulseroute-api}
spec:
  selector: {app: pulseroute-api}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: v1
kind: Service
metadata: {name: pulseroute-worker}
spec:
  selector: {app: pulseroute-worker}
  ports: [{port: 8081, targetPort: 8081}]
